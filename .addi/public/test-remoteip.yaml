name: test_get_remoteip
description: Returns the public IP address and geolocation information (country, region, city, isp, etc.) of the user or a specified IP address using ip-api.com.
inputs:
  ip:
    description: The IP address to query. Leave empty to query the current IP.
    default: ""
runs:
  using: "composite"
  steps:
    - run: |
        const os = require('os');
        const cp = require('child_process');
        
        const ip = "${{ inputs.ip }}";
        const url = ip ? "http://ip-api.com/json/" + ip : "http://ip-api.com/json";
        const platform = os.platform();
        
        console.log("Detect OS: " + platform);
        
        let cmd;
        if (platform === 'win32') {
          // Windows: use PowerShell
          cmd = "powershell -NoProfile -Command \"Invoke-RestMethod -Uri '" + url + "' | ConvertTo-Json\"";
        } else {
          // Linux/Mac: use curl
          cmd = "curl -s \"" + url + "\"";
        }
        
        console.log("Running command: " + cmd);
        try {
          const stdout = cp.execSync(cmd, { encoding: 'utf8' });
          console.log(stdout);
        } catch (err) {
          console.error("Execution failed: " + err.message);
          process.exit(1);
        }
      shell: bun
