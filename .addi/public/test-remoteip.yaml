name: test_get_remoteip
description: Returns the public IP address and geolocation information (country, region, city, isp, etc.) of the user or a specified IP address using ip-api.com.
inputs:
  ip:
    description: The IP address to query. Leave empty to query the current IP.
    default: ""
    type: string
steps:
  - http:
      url: http://ip-api.com/json/${{ inputs.ip }}
      method: GET
