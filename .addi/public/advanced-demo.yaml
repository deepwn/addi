name: "advanced_demo"
description: "Demonstrates advanced features: Contexts (runner, github), Expressions, and cross-platform conditional handling."
inputs:
  mode:
    description: "Execution mode (debug/release)"
    default: "release"
  target:
    description: "Target environment"
    required: false
runs:
  using: "composite"
  steps:
    # 1. 展示 Context 信息
    - name: Dump Contexts
      run: |
        echo "Running on ${{ runner.os }} (${{ runner.arch }})"
        echo "Action Path: ${{ github.action_path }}"
        echo "Workspace: ${{ github.workspace }}"
        echo "Temp Dir: ${{ runner.temp }}"
      shell: bash

    # 2. 条件执行 (If) + 表达式
    - name: Debug Info (Only in debug mode)
      run: echo "Debugging enabled. Target is ${{ inputs.target }}"
      if: ${{ inputs.mode == 'debug' }}

    # 3. 跨平台条件 (runner.os)
    - name: Windows Specific Step
      run: |
        Write-Host "Hello from Windows PowerShell! Env PATH length: $env:Path.Length"
      shell: powershell
      if: ${{ runner.os == 'windows' }}

    - name: Unix Specific Step
      run: echo "Hello from Unix! Home dir is $HOME"
      shell: bash
      if: ${{ runner.os != 'windows' }}

    # 4. 使用 Environment Variables (inputs 自动转换为 INPUT_NAME)
    - name: Check Input Env Var
      run: |
        if [ "$INPUT_MODE" == "release" ]; then
          echo "Release build selected."
        fi
      shell: bash
      if: ${{ runner.os != 'windows' }}

    # 5. 调用外部脚本 (使用 github.action_path)
    # 假设我们复用已有的 remote_ip 脚本
    - name: Reuse Remote IP Script
      run: bun "${{ github.action_path }}/scripts/remote_ip.js"
      shell: bun
      env:
        # Override input via env
        INPUT_IP: "1.1.1.1"
