name: test_get_netinfo
description: Retrieves network configuration information from the host machine. It first detects the operating system and then runs the appropriate command (ipconfig or ifconfig).
inputs: {}
runs:
  using: "composite"
  steps:
    - name: Start Analysis
      run: echo "Starting network analysis..."

    - name: Detect OS Platform
      run: |
        const os = require('os');
        console.log('Detect OS Platform: ' + os.platform());
      shell: bun

    - name: Get Network Info
      run: |
        const os = require('os');
        const cp = require('child_process');
        const platform = os.platform();

        console.log('Fetching active network interfaces...');

        if (platform === 'win32') {
          console.log('Fetching active network interfaces with IP addresses (JSON mode)...');
          // Construct a one-liner script using semicolons carefully
          const psScript = [
            '$data = Get-NetAdapter | Where-Object { $_.Status -eq "Up" } | ForEach-Object {',
            '$adapter = $_;',
            '$ipConfigs = Get-NetIPAddress -InterfaceIndex $_.InterfaceIndex -ErrorAction SilentlyContinue;',
            '@{',
            'Name = $adapter.Name;',
            'Description = $adapter.Description;',
            'MacAddress = $adapter.MacAddress;',
            'Status = $adapter.Status.ToString();',
            'IPs = @(if ($ipConfigs) { $ipConfigs | Select-Object IPAddress, PrefixLength, AddressFamily } else { @() })',
            '}',
            '};',
            'if ($data) { $data | ConvertTo-Json -Depth 4 -Compress } else { "[]" }'
          ].join(' ');

          const cmd = `powershell -NoProfile -Command "${psScript.replace(/"/g, '\\"')}"`;
          
          try {
             const output = cp.execSync(cmd).toString().trim();
             // PowerShell might output nothing if array is empty, handle that
             if (!output) {
                 console.log("No active interfaces found.");
             } else {
                 let interfaces = [];
                 try {
                    // Check if output is a single object or array
                    if (output.startsWith('{')) {
                        interfaces = [JSON.parse(output)];
                    } else if (output.startsWith('[')) {
                        interfaces = JSON.parse(output);
                    } else {
                         console.log("Raw output:", output);
                    }
                 } catch(e) {
                     console.log("Failed to parse JSON:", e.message);
                     console.log("Raw output:", output);
                 }

                 interfaces.forEach(iface => {
                    console.log(`Interface: ${iface.Name}`);
                    console.log(`  Description: ${iface.Description}`);
                    console.log(`  MAC Address: ${iface.MacAddress}`);
                    console.log(`  Status: ${iface.Status}`);
                    
                    if (iface.IPs && iface.IPs.length > 0) {
                        iface.IPs.forEach(ip => {
                            const family = (ip.AddressFamily === 2) ? 'IPv4' : 'IPv6'; // 2 is IPv4
                            console.log(`  ${family}:`);
                            console.log(`    Address: ${ip.IPAddress}`);
                            console.log(`    PrefixLength: ${ip.PrefixLength}`);
                            if (family === 'IPv4') {
                                console.log(`    SubnetMask: /${ip.PrefixLength}`);
                            }
                        });
                    }
                    console.log('');
                 });
             }
             
          } catch(e) {
             console.log('PowerShell execution failed:', e.message);
             // Fallback
             console.log(cp.execSync('ipconfig').toString());
          }
        } else {
           // ... existing linux/mac code ...
           const interfaces = os.networkInterfaces();
           for (const name of Object.keys(interfaces)) {
               const iface = interfaces[name];
               const active = iface.filter(details => !details.internal);
               
               if (active.length > 0) {
                   console.log("Interface: " + name);
                   active.forEach(details => {
                       console.log("  Type: " + details.family);
                       console.log("  Address: " + details.address);
                       console.log("  Netmask: " + details.netmask);
                       console.log("  PrefixLength: " + (details.cidr ? details.cidr.split('/')[1] : active));
                       if (details.mac) console.log("  MAC: " + details.mac);
                       console.log('');
                   });
               }
           }
        }
      shell: bun
