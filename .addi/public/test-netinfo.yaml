name: test_get_netinfo
# Debug comment to trigger reload
description: Retrieves network configuration information from the host machine. It first detects the operating system and then runs the appropriate command (ipconfig or ifconfig).
inputs: {}
runs:
  using: "composite"
  steps:
    - name: Start Analysis
      run: echo "Starting network analysis..."

    - name: Detect OS
      run: |
        const os = require('os');
        console.log('OS Platform: ' + os.platform());
      shell: bun

    - name: Get Network Info
      run: |
        const os = require('os');
        const cp = require('child_process');
        const platform = os.platform();
        
        console.log('Fetching active network interfaces...');
        
        if (platform === 'win32') {
          // On Windows, use PowerShell to filter for active adapters
          // valid status: Up, Connected
          // V2 Updated: Changed to Select-Object to avoid missing cmdlet
          console.log('Fetching active network interfaces (v2 - auto reloaded)...');
          const cmd = 'powershell -NoProfile -Command "Get-NetAdapter | Where-Object { $_.Status -eq \'Up\' } | Select-Object Name, InterfaceDescription, MacAddress, Status | Format-List"';
          try {
             console.log(cp.execSync(cmd).toString());
          } catch(e) {
             // Fallback if Get-NetAdapter is not available (e.g. older Windows) or fails
             console.log('PowerShell command failed, falling back to basic ipconfig...');
             console.log(cp.execSync('ipconfig').toString());
          }
        } else {
           // Mac / Linux
           // Since 'os.networkInterfaces()' is available in Node/Bun, use that for a cross-platform programmatic approach 
           // which is cleaner than parsing ifconfig output.
           const interfaces = os.networkInterfaces();
           for (const name of Object.keys(interfaces)) {
               const iface = interfaces[name];
               // Filter out internal/loopback and down interfaces if possible (though Node API doesn't strictly show 'up/down' easily without non-internal check)
               // and usually only shows active ones or all.
               // Let's filter for non-internal to see "external" connections
               const active = iface.filter(details => !details.internal);
               
               if (active.length > 0) {
                   console.log("Interface: " + name);
                   active.forEach(details => {
                       console.log("  Type: " + details.family);
                       console.log("  Address: " + details.address);
                       console.log("  Netmask: " + details.netmask);
                       if (details.mac) console.log("  MAC: " + details.mac);
                       console.log('');
                   });
               }
           }
        }
      shell: bun
