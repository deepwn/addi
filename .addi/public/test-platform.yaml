name: test_platform
description: "Tests cross-platform conditional execution (if-statements)"
runs:
  using: "composite"
  steps:
    - name: Windows Only Step
      if: ${{ runner.os == 'windows' }}
      run: Write-Host "This step only runs on Windows (PowerShell)"
    
    - name: Unix Only Step
      if: ${{ runner.os != 'windows' }}
      run: echo "This step only runs on Linux or macOS (Bash)"

    - name: Common Step
      run: echo "This step runs everywhere"
